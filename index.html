<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Contas</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2563eb"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Contas"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e5e7eb;--ac:#2563eb;--ok:#15803d;--okb:#dcfce7;--bad:#b91c1c;--badb:#fee2e2;--warn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1317;--card:#181d23;--tx:#e8eaed;--mu:#9aa3af;--bd:#2a313a;--ac:#60a5fa;--ok:#4ade80;--okb:#14301f;--bad:#f87171;--badb:#3a1818;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#0f1317;--card:#181d23;--tx:#e8eaed;--mu:#9aa3af;--bd:#2a313a;--ac:#60a5fa;--ok:#4ade80;--okb:#14301f;--bad:#f87171;--badb:#3a1818;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:15px;margin:0 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav b{font-size:18px;text-transform:capitalize}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
.ban{border-radius:14px;padding:14px;margin-bottom:12px;font-weight:600;font-size:17px}
.ban small{display:block;font-weight:400;opacity:.85;margin-top:2px;font-size:14px}
.ban.ok{background:var(--okb);color:var(--ok)}.ban.bad{background:var(--badb);color:var(--bad)}.ban.n{background:var(--card);border:1px solid var(--bd);color:var(--mu)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.k span{display:block;font-size:12px;color:var(--mu)}.k b{font-size:17px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:2px 0 12px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.r{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.r:first-of-type{border-top:0}
.r input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--ok)}
.r .n{flex:1;min-width:0}.r .n div{overflow-wrap:anywhere}
.r .n small{color:var(--mu)}
.r.pg .n div{text-decoration:line-through;color:var(--mu)}
.r.at .n small{color:var(--bad);font-weight:600}
.r input.v{width:96px;text-align:right}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0}
.x{padding:4px 8px;color:var(--mu)}
.f{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.f input[type=text]{flex:2 1 120px}.f input[type=number]{flex:1 1 80px}
.f label{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--mu)}
.em{color:var(--mu);font-size:14px;padding:6px 0}
</style></head><body><div class="w">
<h1>💰 Controle de Contas</h1>
<div class="nav"><button id="pv">‹</button><b id="ml"></b><button id="nx">›</button></div>
<div id="ban"></div>
<div class="bar"><i id="pb"></i></div>
<div class="g" id="kp"></div>

<div class="card"><h2>Contas do mês</h2><div id="bl"></div>
<div class="f"><input type="text" id="bn" placeholder="Nome da conta"><input type="number" id="bv" placeholder="Valor" step="0.01" inputmode="decimal"><input type="number" id="bd" placeholder="Dia" min="1" max="31" inputmode="numeric" style="max-width:72px"><label><input type="checkbox" id="bf" checked> Fixa</label><button class="p" id="ba">Adicionar</button></div></div>

<div class="card"><h2>Entradas do mês</h2><div id="il"></div>
<div class="f"><input type="text" id="in" placeholder="Origem (ex.: salário)"><input type="number" id="iv" placeholder="Valor" step="0.01" inputmode="decimal"><label><input type="checkbox" id="if" checked> Fixa</label><button class="p" id="ia">Adicionar</button></div></div>
<p class="em">Itens marcados como “fixa” são copiados automaticamente para o mês seguinte (as contas voltam como não pagas). Os dados ficam salvos neste navegador.</p>
</div>
<script>
const KEY='contas-v1';let S={months:{}};
try{S=JSON.parse(localStorage.getItem(KEY))||S}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const now=new Date();
const nk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
let cur=nk(now);
function shift(k,n){const[y,m]=k.split('-').map(Number);return nk(new Date(y,m-1+n,1))}
function M(k){
  if(!S.months[k]){
    const prev=Object.keys(S.months).filter(x=>x<k).sort().pop();
    const m={bills:[],income:[]};
    if(prev){const p=S.months[prev];
      m.bills=p.bills.filter(b=>b.fixa).map(b=>({...b,id:uid(),paid:false}));
      m.income=p.income.filter(i=>i.fixa).map(i=>({...i,id:uid()}));}
    S.months[k]=m;save();
  }
  return S.months[k];
}
function render(){
  const m=M(cur);const[y,mo]=cur.split('-').map(Number);
  $('ml').textContent=new Date(y,mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const inc=m.income.reduce((a,i)=>a+i.value,0);
  const tot=m.bills.reduce((a,b)=>a+b.value,0);
  const paid=m.bills.filter(b=>b.paid).reduce((a,b)=>a+b.value,0);
  const bal=inc-tot;
  const ban=$('ban');
  if(!inc&&!tot){ban.className='ban n';ban.innerHTML='Adicione suas entradas e contas do mês.'}
  else if(bal>=0){ban.className='ban ok';ban.innerHTML='✅ O dinheiro dá conta!<small>Sobram '+brl(bal)+' depois de pagar tudo.</small>'}
  else{ban.className='ban bad';ban.innerHTML='⚠️ Não dá conta<small>Faltam '+brl(-bal)+' para cobrir todas as contas.</small>'}
  $('pb').style.width=(tot?Math.min(100,paid/tot*100):0)+'%';
  $('kp').innerHTML=[['Entradas',inc],['Total de contas',tot],['Já pago',paid],['Falta pagar',tot-paid],['Saldo atual (entradas − pago)',inc-paid],['Saldo previsto',bal]]
    .map(([a,b])=>'<div class="k"><span>'+a+'</span><b'+(b<0?' style="color:var(--bad)"':'')+'>'+brl(b)+'</b></div>').join('');
  const isNow=cur===nk(now),td=now.getDate();
  const bills=[...m.bills].sort((a,b)=>(a.day||99)-(b.day||99));
  $('bl').innerHTML=bills.length?bills.map(b=>{
    const late=isNow&&!b.paid&&b.day&&b.day<td;
    return '<div class="r'+(b.paid?' pg':'')+(late?' at':'')+'"><input type="checkbox" data-p="'+b.id+'"'+(b.paid?' checked':'')+'><div class="n"><div>'+esc(b.name)+'</div><small>'+(b.day?'vence dia '+b.day:'sem vencimento')+(late?' · atrasada':'')+(b.fixa?' · fixa':'')+'</small></div><input class="v" type="number" step="0.01" inputmode="decimal" data-bv="'+b.id+'" value="'+b.value+'"><button class="x" data-bx="'+b.id+'">✕</button></div>'}).join(''):'<div class="em">Nenhuma conta ainda.</div>';
  $('il').innerHTML=m.income.length?m.income.map(i=>'<div class="r"><div class="n"><div>'+esc(i.name)+'</div><small>'+(i.fixa?'fixa':'só este mês')+'</small></div><input class="v" type="number" step="0.01" inputmode="decimal" data-iv="'+i.id+'" value="'+i.value+'"><button class="x" data-ix="'+i.id+'">✕</button></div>').join(''):'<div class="em">Nenhuma entrada ainda.</div>';
}
document.addEventListener('click',e=>{
  const t=e.target,m=M(cur);
  if(t.dataset.bx){m.bills=m.bills.filter(b=>b.id!==t.dataset.bx)}
  else if(t.dataset.ix){m.income=m.income.filter(i=>i.id!==t.dataset.ix)}
  else return;
  save();render();
});
document.addEventListener('change',e=>{
  const t=e.target,m=M(cur);
  if(t.dataset.p){m.bills.find(b=>b.id===t.dataset.p).paid=t.checked}
  else if(t.dataset.bv){m.bills.find(b=>b.id===t.dataset.bv).value=parseFloat(t.value)||0}
  else if(t.dataset.iv){m.income.find(i=>i.id===t.dataset.iv).value=parseFloat(t.value)||0}
  else return;
  save();render();
});
$('ba').onclick=()=>{
  const n=$('bn').value.trim(),v=parseFloat($('bv').value);
  if(!n||isNaN(v))return;
  M(cur).bills.push({id:uid(),name:n,value:v,day:parseInt($('bd').value)||0,fixa:$('bf').checked,paid:false});
  $('bn').value=$('bv').value=$('bd').value='';save();render();
};
$('ia').onclick=()=>{
  const n=$('in').value.trim(),v=parseFloat($('iv').value);
  if(!n||isNaN(v))return;
  M(cur).income.push({id:uid(),name:n,value:v,fixa:$('if').checked});
  $('in').value=$('iv').value='';save();render();
};
$('pv').onclick=()=>{cur=shift(cur,-1);render()};
$('nx').onclick=()=>{cur=shift(cur,1);render()};
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script></body></html>
